server {
    listen 80;
    server_name localhost ibai3d.byaritz.com;

    root /usr/share/nginx/html;
    index index.html;

    # Codificación de caracteres
    charset utf-8;

    # Tipos MIME estándar y adicionales para 3D y PWA
    include /etc/nginx/mime.types;
    types {
        application/octet-stream fbx mtl;
        application/manifest+json webmanifest;
    }

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache control para index.html y sw.js (siempre actualizados)
    location ~* ^/(index\.html|sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Manifest PWA e iconos
    location ~* \.(json|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Modelos 3D, texturas e imágenes
    location ~* \.(fbx|png|jpg|jpeg|gif|webp|svg|ico|mtl)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Scripts y estilos
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Bloquear acceso a archivos y directorios ocultos (ej: .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Bloquear acceso a archivos de configuración y documentación interna
    location ~* \.(ya?ml|md|log|sh|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Enrutamiento estático principal
    location / {
        try_files $uri $uri/ /index.html;
    }
}
