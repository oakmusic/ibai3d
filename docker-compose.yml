name: ibai3d

services:
  web:
    image: nginx:alpine
    container_name: ibai3d-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5187:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=UTC
    security_opt:
      - no-new-privileges:true
